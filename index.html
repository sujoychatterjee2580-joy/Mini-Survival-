<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Circuit Flow ⚡ - Global Puzzle</title>
  <meta name="description" content="Rotate the neon circuit paths, manage your move budget, and connect the energy flow to power the core!" />
  <style>
    :root {
      --bg: #060913;
      --card-bg: #0f172a;
      --neon-cyan: #00f0ff;
      --neon-glow: rgba(0, 240, 255, 0.45);
      --gold: #fbbf24;
      --wire-base: #334155;
      --border-line: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #172554, var(--bg));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }

    .game-card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border-line);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Top HUD */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .hud-badge {
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .badge-cyan { color: var(--neon-cyan); }
    .badge-gold { color: var(--gold); }
    .badge-moves { color: #f43f5e; }

    /* Energy Stream Pulse Animation */
    @keyframes electricPulse {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }

    /* Puzzle Grid */
    #grid-wrap {
      width: 320px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      background: rgba(2, 6, 23, 0.7);
      padding: 10px;
      border-radius: 20px;
      border: 2px solid var(--border-line);
      margin-bottom: 16px;
      position: relative;
    }

    .tile {
      background: #1e293b;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
      position: relative;
    }

    .tile:active {
      transform: scale(0.92);
    }

    .tile.locked {
      box-shadow: inset 0 0 12px rgba(251, 191, 36, 0.4);
      border-color: rgba(251, 191, 36, 0.6);
    }

    .tile svg {
      width: 82%;
      height: 82%;
      pointer-events: none;
    }

    .wire-base {
      stroke: var(--wire-base);
      stroke-width: 14;
      stroke-linecap: round;
      fill: none;
    }

    .wire-active {
      stroke: var(--neon-cyan);
      stroke-width: 8;
      stroke-linecap: round;
      fill: none;
      display: none;
      filter: drop-shadow(0 0 6px var(--neon-cyan));
    }

    .tile.powered .wire-active {
      display: block;
      stroke-dasharray: 10, 8;
      animation: electricPulse 0.8s linear infinite;
    }

    /* Action Toolbar */
    .toolbar {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      background: #1e293b;
      border: 1px solid var(--border-line);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.95);
    }

    /* Win Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 9, 19, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }

    .modal-overlay h1 {
      font-size: 26px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .star-bar {
      font-size: 30px;
      letter-spacing: 6px;
      margin-bottom: 12px;
    }

    .btn-next {
      background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
      color: #000;
      border: none;
      padding: 13px 34px;
      font-size: 16px;
      font-weight: 900;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--neon-glow);
    }

    .btn-next:active {
      transform: scale(0.96);
    }

    /* Particles Canvas */
    #fx-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: 24px;
      z-index: 80;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <canvas id="fx-canvas"></canvas>

    <!-- Win Modal Screen -->
    <div id="win-modal" class="modal-overlay" style="display: none;">
      <h1>CIRCUIT ENERGIZED! ⚡</h1>
      <div class="star-bar" id="star-display">⭐⭐⭐</div>
      <p id="win-stats" style="color: #cbd5e1; font-size: 14px; margin-bottom: 22px;">Completed with perfect moves!</p>
      <button class="btn-next" onclick="nextLevel()">NEXT LEVEL ⏩</button>
    </div>

    <!-- HUD -->
    <div class="top-bar">
      <div class="hud-badge badge-cyan">⚡ LVL <span id="lvl-txt">1</span></div>
      <div class="hud-badge badge-moves">🔄 MOVES: <span id="moves-txt">0</span></div>
      <div class="hud-badge badge-gold">⭐ <span id="score-txt">0</span></div>
    </div>

    <!-- Circuit Grid -->
    <div id="grid-wrap"></div>

    <!-- Controls -->
    <div class="toolbar">
      <button class="btn-action" onclick="useAutoAlign()">💡 Auto-Align (<span id="hint-count">2</span>)</button>
      <button class="btn-action" onclick="restartLevel()">🔄 Reset</button>
    </div>
  </div>

  <script>
    // --- Audio Synthesizer Engine ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type, duration, vol = 0.15) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function soundClick() { playTone(540, 'sine', 0.05, 0.12); }
    function soundHint() {
      playTone(400, 'triangle', 0.08, 0.15);
      setTimeout(() => playTone(600, 'triangle', 0.15, 0.2), 60);
    }
    function soundPower() {
      playTone(523.25, 'triangle', 0.12, 0.2);
      setTimeout(() => playTone(659.25, 'triangle', 0.15, 0.2), 70);
      setTimeout(() => playTone(1046.5, 'triangle', 0.35, 0.25), 140);
    }

    function triggerHaptic(strong = false) {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(strong ? [40, 60, 80] : 18);
      }
    }

    // --- Shapes Definition ---
    const SHAPES = {
      'line': [0, 2],
      'corner': [0, 1],
      't': [0, 1, 3],
      'end': [0]
    };

    // --- Progressive Levels Database with Target Pars ---
    const LEVELS = [
      {
        par: 4,
        layout: [
          { shape: 'corner', correctRot: 1 }, { shape: 'line', correctRot: 1 },   { shape: 'corner', correctRot: 2 },
          { shape: 'line', correctRot: 0 },   { shape: 'corner', correctRot: 0 }, { shape: 'line', correctRot: 0 },
          { shape: 'end', correctRot: 1 },    { shape: 'line', correctRot: 1 },   { shape: 'end', correctRot: 0 }
        ]
      },
      {
        par: 6,
        layout: [
          { shape: 'corner', correctRot: 1 }, { shape: 'corner', correctRot: 2 }, { shape: 'corner', correctRot: 1 },
          { shape: 'corner', correctRot: 0 }, { shape: 'corner', correctRot: 3 }, { shape: 'line', correctRot: 0 },
          { shape: 'line', correctRot: 1 },   { shape: 'line', correctRot: 1 },   { shape: 'corner', correctRot: 0 }
        ]
      },
      {
        par: 7,
        layout: [
          { shape: 'corner', correctRot: 1 }, { shape: 't', correctRot: 2 },      { shape: 'corner', correctRot: 2 },
          { shape: 'line', correctRot: 0 },   { shape: 'line', correctRot: 0 },   { shape: 'line', correctRot: 0 },
          { shape: 'corner', correctRot: 0 }, { shape: 't', correctRot: 0 },      { shape: 'corner', correctRot: 3 }
        ]
      }
    ];

    let currentLvl = 1;
    let score = 0;
    let moves = 0;
    let hintsRemaining = 2;
    let gridData = [];
    let isLevelWon = false;

    const gridWrap = document.getElementById('grid-wrap');
    const lvlTxt = document.getElementById('lvl-txt');
    const movesTxt = document.getElementById('moves-txt');
    const scoreTxt = document.getElementById('score-txt');
    const hintsTxt = document.getElementById('hint-count');
    const winModal = document.getElementById('win-modal');
    const starDisplay = document.getElementById('star-display');
    const winStats = document.getElementById('win-stats');

    function loadLevel(lvlIndex) {
      isLevelWon = false;
      moves = 0;
      movesTxt.innerText = "0";
      lvlTxt.innerText = currentLvl;

      const lvlConf = LEVELS[(lvlIndex - 1) % LEVELS.length];
      gridData = lvlConf.layout.map((item, idx) => {
        // Scramble tile by 1 to 3 rotations
        const shift = Math.floor(Math.random() * 3) + 1;
        return {
          idx: idx,
          shape: item.shape,
          rot: (item.correctRot + shift) % 4,
          correctRot: item.correctRot,
          powered: false,
          locked: false
        };
      });

      renderGrid();
      checkFlow();
    }

    function renderGrid() {
      gridWrap.innerHTML = '';
      gridData.forEach((tile, i) => {
        const div = document.createElement('div');
        div.className = 'tile' + (tile.powered ? ' powered' : '') + (tile.locked ? ' locked' : '');
        div.style.transform = `rotate(${tile.rot * 90}deg)`;
        div.onclick = () => rotateTile(i);

        div.innerHTML = getSVGMarkup(tile.shape);
        gridWrap.appendChild(div);
      });
    }

    function getSVGMarkup(shape) {
      if (shape === 'line') {
        return `<svg viewBox="0 0 100 100">
          <line x1="50" y1="0" x2="50" y2="100" class="wire-base"/>
          <line x1="50" y1="0" x2="50" y2="100" class="wire-active"/>
        </svg>`;
      } else if (shape === 'corner') {
        return `<svg viewBox="0 0 100 100">
          <path d="M50 0 L50 50 L100 50" class="wire-base"/>
          <path d="M50 0 L50 50 L100 50" class="wire-active"/>
        </svg>`;
      } else if (shape === 't') {
        return `<svg viewBox="0 0 100 100">
          <path d="M0 50 L100 50 M50 0 L50 50" class="wire-base"/>
          <path d="M0 50 L100 50 M50 0 L50 50" class="wire-active"/>
        </svg>`;
      } else { // end
        return `<svg viewBox="0 0 100 100">
          <line x1="50" y1="0" x2="50" y2="50" class="wire-base"/>
          <line x1="50" y1="0" x2="50" y2="50" class="wire-active"/>
          <circle cx="50" cy="50" r="14" fill="currentColor"/>
        </svg>`;
      }
    }

    function rotateTile(index) {
      if (isLevelWon || gridData[index].locked) return;
      initAudio();
      soundClick();
      triggerHaptic();

      moves++;
      movesTxt.innerText = moves;

      gridData[index].rot = (gridData[index].rot + 1) % 4;

      const tileEls = gridWrap.querySelectorAll('.tile');
      tileEls[index].style.transform = `rotate(${gridData[index].rot * 90}deg)`;

      checkFlow();
    }

    // Auto-Align Hint: Fixes 1 incorrect tile and locks it
    function useAutoAlign() {
      if (isLevelWon || hintsRemaining <= 0) return;

      const wrongTiles = gridData.filter(t => t.rot !== t.correctRot && !t.locked);
      if (wrongTiles.length === 0) return;

      const chosen = wrongTiles[Math.floor(Math.random() * wrongTiles.length)];
      chosen.rot = chosen.correctRot;
      chosen.locked = true;

      hintsRemaining--;
      hintsTxt.innerText = hintsRemaining;
      soundHint();
      triggerHaptic();

      const tileEls = gridWrap.querySelectorAll('.tile');
      tileEls[chosen.idx].style.transform = `rotate(${chosen.rot * 90}deg)`;
      tileEls[chosen.idx].classList.add('locked');

      checkFlow();
    }

    function getOpenings(tile) {
      return SHAPES[tile.shape].map(dir => (dir + tile.rot) % 4);
    }

    function checkFlow() {
      gridData.forEach(t => t.powered = false);

      const queue = [0];
      const visited = new Set([0]);
      gridData[0].powered = true;

      const OPPOSITE = [2, 3, 0, 1];
      const DELTAS = [-3, 1, 3, -1];

      while (queue.length > 0) {
        const currIdx = queue.shift();
        const currOpenings = getOpenings(gridData[currIdx]);
        const r = Math.floor(currIdx / 3);
        const c = currIdx % 3;

        currOpenings.forEach(dir => {
          let nr = r, nc = c;
          if (dir === 0) nr--;
          else if (dir === 1) nc++;
          else if (dir === 2) nr++;
          else if (dir === 3) nc--;

          if (nr >= 0 && nr < 3 && nc >= 0 && nc < 3) {
            const nextIdx = nr * 3 + nc;
            if (!visited.has(nextIdx)) {
              const nextOpenings = getOpenings(gridData[nextIdx]);
              if (nextOpenings.includes(OPPOSITE[dir])) {
                gridData[nextIdx].powered = true;
                visited.add(nextIdx);
                queue.push(nextIdx);
              }
            }
          }
        });
      }

      // Update Visuals
      const tileEls = gridWrap.querySelectorAll('.tile');
      gridData.forEach((t, i) => {
        if (t.powered) tileEls[i].classList.add('powered');
        else tileEls[i].classList.remove('powered');
      });

      // Victory Condition: Bottom-right tile (index 8) is powered
      if (gridData[8].powered && !isLevelWon) {
        isLevelWon = true;
        soundPower();
        triggerHaptic(true);
        triggerFXSparks();

        // Star Rating Calculation
        const lvlConf = LEVELS[(currentLvl - 1) % LEVELS.length];
        let stars = "⭐⭐⭐";
        let gain = 60;
        if (moves <= lvlConf.par) {
          stars = "⭐⭐⭐";
          gain = 60;
        } else if (moves <= lvlConf.par + 3) {
          stars = "⭐⭐";
          gain = 40;
        } else {
          stars = "⭐";
          gain = 25;
        }

        score += gain;
        scoreTxt.innerText = score;
        starDisplay.innerText = stars;
        winStats.innerHTML = `Completed in <b>${moves}</b> moves (Target Par: ${lvlConf.par})`;

        setTimeout(() => {
          winModal.style.display = 'flex';
        }, 400);
      }
    }

    function restartLevel() {
      loadLevel(currentLvl);
    }

    function nextLevel() {
      winModal.style.display = 'none';
      currentLvl++;
      loadLevel(currentLvl);
    }

    // --- Particle Sparks FX Engine ---
    const fxCanvas = document.getElementById("fx-canvas");
    const fxCtx = fxCanvas.getContext("2d");
    let sparks = [];

    function triggerFXSparks() {
      fxCanvas.width = fxCanvas.clientWidth;
      fxCanvas.height = fxCanvas.clientHeight;
      sparks = [];

      for (let i = 0; i < 35; i++) {
        sparks.push({
          x: fxCanvas.width * 0.8,
          y: fxCanvas.height * 0.65,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.7) * 9,
          color: Math.random() > 0.5 ? '#00f0ff' : '#fbbf24',
          radius: Math.random() * 3 + 2,
          alpha: 1
        });
      }
      requestAnimationFrame(runSparks);
    }

    function runSparks() {
      fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
      for (let i = sparks.length - 1; i >= 0; i--) {
        const p = sparks[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.alpha -= 0.025;

        if (p.alpha <= 0) {
          sparks.splice(i, 1);
        } else {
          fxCtx.save();
          fxCtx.globalAlpha = p.alpha;
          fxCtx.fillStyle = p.color;
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          fxCtx.fill();
          fxCtx.restore();
        }
      }
      if (sparks.length > 0) requestAnimationFrame(runSparks);
    }

    // Initialize
    loadLevel(currentLvl);
  </script>
</body>
</html>
